[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-automation"
version = "1.0.0"
description = "E2E automation for eBay: search under price, add to cart, assert cart total (Playwright + POM)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "pytest-rerunfailures>=14.0",
    "allure-pytest>=2.13",
    "pytest-html>=4.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --alluredir=reports/allure-results --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html"
markers = [
    "e2e: end-to-end tests against live eBay",
    "unit: fast offline tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep the quoted buggy snippet in ReadMeAIBugs.md verbatim

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]
